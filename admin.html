<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - Biryani Mahal</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="admin-body">

<div class="admin-login" id="adminLogin">
  <div class="admin-login-box">
    <i class="fas fa-lock admin-lock"></i>
    <h2>Admin Login</h2>
    <p>Biryani Mahal Orders Backup</p>
    <form onsubmit="adminLogin(event)">
      <input type="text" id="adminUser" placeholder="Username" required>
      <input type="password" id="adminPass" placeholder="Password" required>
      <button type="submit" class="btn-primary btn-full">Login</button>
      <p class="hint">Demo: admin / admin123</p>
    </form>
    <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Website</a>
  </div>
</div>

<div class="admin-panel" id="adminPanel" style="display:none;">
  <header class="admin-header">
    <div class="admin-header-left">
      <i class="fas fa-utensils"></i>
      <h1>Biryani Mahal - Order Backup</h1>
    </div>
    <div class="admin-header-right">
      <button class="btn-export" onclick="exportOrders()"><i class="fas fa-download"></i> Export CSV</button>
      <button class="btn-logout" onclick="adminLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </header>

  <div class="admin-container">
    <div class="admin-stats">
      <div class="stat-card blue"><i class="fas fa-receipt"></i><div><h3 id="statTotal">0</h3><p>Total Orders</p></div></div>
      <div class="stat-card green"><i class="fas fa-rupee-sign"></i><div><h3 id="statRevenue">₹0</h3><p>Total Revenue</p></div></div>
      <div class="stat-card orange"><i class="fas fa-clock"></i><div><h3 id="statPending">0</h3><p>Pending</p></div></div>
      <div class="stat-card purple"><i class="fas fa-check-circle"></i><div><h3 id="statDelivered">0</h3><p>Delivered</p></div></div>
    </div>

    <div class="admin-controls">
      <input type="text" id="orderSearch" placeholder="🔍 Search by Order ID, Name, Phone..." onkeyup="renderOrders()">
      <select id="statusFilter" onchange="renderOrders()">
        <option value="">All Status</option>
        <option value="Pending">Pending</option>
        <option value="Preparing">Preparing</option>
        <option value="Out for Delivery">Out for Delivery</option>
        <option value="Delivered">Delivered</option>
        <option value="Cancelled">Cancelled</option>
      </select>
      <button class="btn-danger" onclick="clearAllOrders()"><i class="fas fa-trash"></i> Clear All</button>
    </div>

    <div class="orders-list" id="ordersList"></div>
  </div>
</div>

<script src="js/admin.js"></script>
</body>
</html>
